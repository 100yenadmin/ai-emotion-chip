# Shared plugin bug form. Field ids and labels are FROZEN across our plugin repos: the
# report-a-problem skill drafts issues with these same headings, so do not rename them.
# Per repo: description, the security line, the diagnostics hint, and the surface options.
name: Bug report
description: Something in Hermes Emotion Chip is broken or behaves unexpectedly.
labels: ["bug", "triage-pending"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Your Hermes agent can draft it for you: ask it to "report a problem with Hermes Emotion Chip".
        **Security problems** (a leaked ElevenLabs or Fish Audio key, audio sent somewhere you did not choose, or anything that exposes a secret) go to a [private advisory](https://github.com/100yenadmin/ai-emotion-chip/security/advisories/new), not here.
        **Problems in Hermes itself** belong in [NousResearch/hermes-agent](https://github.com/NousResearch/hermes-agent/issues).
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
      description: The emotion-chip entry from `hermes plugins list --json` (version and source).
    validations:
      required: true
  - type: input
    id: hermes_version
    attributes:
      label: Hermes version
      description: Output of `hermes --version`.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where it happened
      options:
        - text_to_speech tool (chat reply with a voice note)
        - Telegram or another messaging gateway
        - Hermes Desktop
        - Hermes CLI / voice mode
        - hermes chip command line
        - Rendering only (wrong cue output)
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26, Ubuntu 24.04, Windows 11 ...
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Output of `hermes chip status` and `hermes plugins list --json` (leave out keys).
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Short excerpts only, for example from `hermes logs --since 1h -n 2000 | grep -i emotion-chip`. Leave out tokens, keys and private message text.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report contains no secrets, tokens or private messages.
          required: true
        - label: An AI agent helped draft this report, and I reviewed it.
