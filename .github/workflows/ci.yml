name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg
        # The E7 tests encode and measure synthetic tones with the real ffmpeg.
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Validate data
        run: python -m emotion_chip validate-data
        env:
          PYTHONPATH: plugin
      - name: Test
        run: python -m pytest -q
      - name: Check generated bundle
        run: python -m emotion_chip check-bundle
        env:
          PYTHONPATH: plugin
