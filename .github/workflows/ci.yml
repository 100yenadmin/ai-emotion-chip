name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg
        # The E7 tests encode and measure synthetic tones with the real ffmpeg.
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Validate data
        run: python -m emotion_chip validate-data
      - name: Test
        run: python -m pytest -q
      - name: Check generated bundle
        run: python -m emotion_chip check-bundle
