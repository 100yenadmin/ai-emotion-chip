name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate data
        run: python -m emotion_chip validate-data
      - name: Test
        run: python -m pytest -q
      - name: Wheel ships the data
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for need in ("emotion_chip/data/emotions.yaml", "emotion_chip/data/guide/section.md",
                       "emotion_chip/data/ratings/prompt.txt", "emotion_chip/data/dialects/eleven_v4.yaml"):
              assert need in names, need
          print("wheel data ok:", len(names), "files")
          PY
