name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Validate data
        run: python -m emotion_chip validate-data
      - name: Test
        run: python -m pytest -q
      - name: Check generated bundle
        run: python -m emotion_chip check-bundle
